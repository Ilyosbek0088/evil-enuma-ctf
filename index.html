<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000">
<title>localCTF · Flag Portal</title>

<script>
/* Dark by default; only an explicit "light" choice changes it. */
(function(){
 var t="dark";
 try{ if(localStorage.getItem("ctf_theme")==="light") t="light"; }catch(e){}
 document.documentElement.setAttribute("data-theme",t);
 var m=document.querySelector('meta[name="theme-color"]');
 if(m) m.setAttribute("content",t==="light"?"#ffffff":"#000000");
})();
</script>
<style>
/* ============================================================
   Black and white. Square. Hard edges.
   ============================================================ */
:root{
 color-scheme:dark;
 --bg:#000;--fg:#fff;--mut:#a3a3a3;--soft:#161616;--dot:#242424;
 --bw:2px;
 --ease:cubic-bezier(.2,.8,.2,1);
 --mono:ui-monospace,"JetBrains Mono","SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
 --serif:Georgia,"Times New Roman",serif;
 --safe:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{color-scheme:light;--bg:#fff;--fg:#000;--mut:#575757;--soft:#ededed;--dot:#dcdcdc}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0}
html{background:var(--bg);color:var(--fg);-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-color:var(--fg) var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;font:14px/1.55 var(--mono);overflow-wrap:anywhere;overflow-x:clip;background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.5px);background-size:22px 22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
code{font-family:var(--mono)}

/* ---------- Icons ---------- */
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
html[data-theme="dark"] .i-moon,html[data-theme="light"] .i-sun{display:none}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;background:var(--bg);color:var(--fg);border:var(--bw) solid var(--fg);font-weight:700;white-space:nowrap;box-shadow:3px 3px 0 var(--fg);transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .15s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--fg)}
.btn.solid{background:var(--fg);color:var(--bg)}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;padding:0;background:var(--bg);color:var(--fg);border:var(--bw) solid var(--fg);transition:background .15s,color .15s}
.ib:active:not(:disabled){background:var(--fg);color:var(--bg)}
@media(hover:hover){
 .btn:hover{background:var(--soft);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--fg)}
 .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--fg)}
 .btn.solid:hover{background:var(--mut)}
 .ib:hover:not(:disabled){background:var(--fg);color:var(--bg)}
}
.field{display:block;width:100%;min-height:44px;padding:9px 12px;background:var(--bg);color:var(--fg);border:var(--bw) solid var(--fg);font-size:16px}
input.field:not([type="file"]),textarea.field{-webkit-appearance:none;appearance:none}
.field::placeholder{color:var(--mut);opacity:1}
select.field{-webkit-appearance:none;appearance:none;padding-right:36px;background-color:var(--bg);background-image:linear-gradient(45deg,transparent 50%,var(--fg) 50%),linear-gradient(135deg,var(--fg) 50%,transparent 50%);background-position:calc(100% - 19px) 55%,calc(100% - 13px) 55%;background-size:6px 6px;background-repeat:no-repeat}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:var(--bw) solid var(--fg)}
.top-in{max-width:960px;margin:0 auto;height:54px;padding:0 14px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:800;font-size:18px;letter-spacing:-.02em;text-decoration:none}
.mark{width:30px;height:30px;display:grid;place-items:center;background:var(--fg);color:var(--bg);font:700 19px/1 var(--mono);padding-bottom:1px}
.top .ib{width:40px;height:40px}
.tagline{margin-left:10px;color:var(--mut);font-size:12px;font-weight:400;letter-spacing:0;white-space:nowrap}

/* ---------- Layout ---------- */
main{max-width:960px;margin:0 auto;padding:22px 14px 40px}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.7fr);gap:var(--bw);background:var(--fg);border:var(--bw) solid var(--fg);box-shadow:5px 5px 0 var(--fg);margin:0 5px 0 0}
.stat{background:var(--bg);padding:10px 12px;min-width:0}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.04em}
.stat span{display:block;margin-top:2px;color:var(--mut);font-size:12px}
.stat.top b{font-size:15px;line-height:1.7;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Progress ---------- */
.progress{height:16px;margin:14px 5px 0 0;border:var(--bw) solid var(--fg);background:var(--bg);box-shadow:5px 5px 0 var(--fg);padding:2px}
.progress i{display:block;height:100%;width:0;background:var(--fg);transition:width .5s var(--ease)}

/* ---------- Toolbar ---------- */
.bar{display:grid;grid-template-columns:minmax(0,1fr) 168px auto;gap:10px;margin:28px 0 14px}

/* ---------- List ---------- */
.list{border:var(--bw) solid var(--fg);background:var(--bg)}
.row{display:grid;grid-template-columns:54px minmax(0,1fr) auto;border-top:var(--bw) solid var(--fg);background:var(--bg);cursor:pointer}
.row:first-child{border-top:0}
.list.anim .row{animation:rowIn .55s var(--ease) backwards;animation-delay:calc(var(--i,0)*45ms)}
.rank{display:grid;place-items:center;border-right:var(--bw) solid var(--fg);font-weight:800;font-size:18px;letter-spacing:-.04em}
.row.solved .rank{background:var(--fg);color:var(--bg)}
.info{min-width:0;padding:13px 15px}
.t{font-weight:800;font-size:17px;line-height:1.25;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.n{margin:5px 0 0;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;margin-top:10px;padding:1px 7px;border:1px solid var(--fg);font-size:11px}
.tag.done{background:var(--fg);color:var(--bg)}
.acts{display:flex;gap:6px;padding:13px;align-items:flex-start}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}

/* ---------- Dialogs ---------- */
dialog{width:min(560px,calc(100% - 24px));max-height:calc(100dvh - 24px);padding:0;background:var(--bg);color:var(--fg);border:var(--bw) solid var(--fg);box-shadow:6px 6px 0 var(--fg);overflow:auto}
dialog[open]{animation:dlgIn .3s var(--ease)}
dialog[open]::backdrop{animation:fadeIn .25s ease}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:var(--bw) solid var(--fg)}
.dlg-head h2{margin:0;font-size:16px;font-weight:800}
.form{display:grid;gap:14px;padding:16px}
.lab{display:grid;gap:6px;font-weight:700}
.lab small{font-weight:400;color:var(--mut)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.meta span{padding:1px 8px;border:1px solid var(--fg);font-size:11px;font-weight:700;letter-spacing:.04em}
.brief{margin:0;color:var(--fg)}
.cmd{margin:0;padding:10px 12px;border:var(--bw) solid var(--fg);background:var(--soft);font-size:13px;overflow-x:auto;white-space:pre}
.path{margin:0;color:var(--mut);font-size:12px;word-break:break-all}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:2px 3px 0 0}
.solved-box{border:var(--bw) solid var(--fg);background:var(--soft);padding:10px 12px;display:grid;gap:3px}
.solved-box b{font-size:12px;letter-spacing:.14em}
.solved-box code{font-size:13px;word-break:break-all}
.stamp{background:var(--fg);color:var(--bg);border:var(--bw) solid var(--fg);text-align:center;font-weight:800;letter-spacing:.3em;padding:14px;font-size:18px}
.stamp.run{animation:stamp .7s cubic-bezier(.2,1.25,.3,1)}
.link{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:0 12px;border:var(--bw) solid var(--fg);text-decoration:none;font-weight:700;transition:background .15s,color .15s}
.link:active{background:var(--fg);color:var(--bg)}
@media(hover:hover){.link:hover{background:var(--fg);color:var(--bg)}}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe));transform:translate(-50%,16px);z-index:300;max-width:calc(100% - 28px);width:max-content;padding:10px 14px;background:var(--fg);color:var(--bg);font-weight:700;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Fab ---------- */
.fab{display:none}

/* ---------- Keyframes ---------- */
@keyframes rowIn{from{opacity:0;transform:translateY(20px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes dlgIn{from{opacity:0;transform:translateY(26px)}}
@keyframes stamp{from{opacity:0;transform:scale(1.55) rotate(-9deg)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.shake{animation:shake .5s var(--ease)}

/* ---------- Desktop ---------- */
@media(min-width:861px){
 .fab{display:none}
}

/* ---------- Phones ---------- */
@media(max-width:860px){
 :root{--ph:calc(64px + var(--safe))}
 main{padding:16px 14px calc(var(--ph) + 92px)}
 .bar{grid-template-columns:minmax(0,1fr) 124px;margin-top:22px}
 .bar .btn{grid-column:1/-1}
 .stat{padding:9px 10px}
 .stat b{font-size:24px}
 .row{grid-template-columns:42px minmax(0,1fr)}
 .rank{font-size:15px}
 .info{padding:10px 12px}
 .t{font-size:15px}
 .n{-webkit-line-clamp:2}
 .acts{grid-column:1/-1;padding:0;gap:0;border-top:var(--bw) solid var(--fg)}
 .acts .btn{flex:1;border:0;border-left:var(--bw) solid var(--fg);box-shadow:none;min-height:46px}
 .acts .btn:first-child{border-left:0}
 dialog{width:100%;max-width:none;margin:auto 0 0;border-width:var(--bw) 0 0;box-shadow:none;padding-bottom:var(--safe)}
 .form-actions{margin-right:0}
 .toast{bottom:calc(var(--ph) + 24px)}
 .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(var(--ph) + 18px);z-index:44;width:58px;height:58px;background:var(--fg);color:var(--bg);border:var(--bw) solid var(--fg);box-shadow:5px 5px 0 var(--mut);transition:transform .15s var(--ease),box-shadow .15s}
 .fab:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--mut)}
 .fab .i{width:26px;height:26px;stroke-width:2.5}
}
@media(max-width:360px){
 .top-in,main{padding-left:10px;padding-right:10px}
 .btn{padding:0 12px}
 .tagline{display:none}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
 <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></symbol>
 <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
 <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></symbol>
 <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.7 2.7L3 8M3 3v5h5"/></symbol>
 <symbol id="i-ext" viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"/></symbol>
</defs></svg>

<header class="top"><div class="top-in">
 <a class="brand" href="#" aria-label="Flag Portal"><span class="mark">F</span>FLAG PORTAL<span class="tagline">localCTF</span></a>
 <button class="ib" id="themeBtn" type="button" aria-label="Theme"><svg class="i i-sun"><use href="#i-sun"/></svg><svg class="i i-moon"><use href="#i-moon"/></svg></button>
</div></header>

<main>
 <section class="view">
  <div class="stats">
   <div class="stat"><b id="sSolved">0</b><span>Solved</span></div>
   <div class="stat"><b id="sPoints">0</b><span>Points</span></div>
   <div class="stat top"><b id="sStatus">IN PROGRESS</b><span>Status</span></div>
  </div>

  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" aria-label="Challenges solved"><i id="pbar"></i></div>

  <div class="bar">
   <input class="field" id="q" type="search" placeholder="Search challenges" autocomplete="off" aria-label="Search challenges">
   <select class="field" id="filter" aria-label="Filter">
    <option value="all">All</option>
    <option value="unsolved">Unsolved</option>
    <option value="solved">Solved</option>
   </select>
   <button class="btn" id="resetBtn" type="button"><svg class="i"><use href="#i-reset"/></svg><span>Reset</span></button>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>No challenges match this view.</div>
  <p class="path" style="margin-top:18px">Download a challenge file, solve it, then submit the flag here. Progress is saved only in this browser.</p>
  <a class="link" href="challenges.zip" download style="margin-top:14px"><span>Download all 10 challenges (.zip)</span><svg class="i"><use href="#i-ext"/></svg></a>
 </section>
</main>

<button class="fab" id="fab" type="button" aria-label="Next unsolved"><svg class="i"><use href="#i-target"/></svg></button>

<dialog id="dlg" aria-labelledby="dlgTitle">
 <div class="dlg-head"><h2 id="dlgTitle">Challenge</h2><button class="ib" type="button" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
 <div class="form">
  <p class="meta" id="dMeta"></p>
  <p class="brief" id="dDesc"></p>
  <p class="lab" style="margin:0;font-size:12px;color:var(--mut)">Hint</p>
  <pre class="cmd" id="dHint"></pre>
  <div id="dFiles" style="display:grid;gap:10px"></div>
  <div class="stamp" id="dStamp" hidden>SOLVED</div>
  <div class="solved-box" id="dSolved" hidden>
   <b>RECOVERED FLAG</b>
   <code id="dSolvedFlag"></code>
  </div>
  <label class="lab"><span>Flag</span><input class="field" id="dFlag" placeholder="EVIL-ENUMA{...}" autocomplete="off" spellcheck="false"></label>
  <div class="form-actions"><button class="btn" type="button" data-close>Close</button><button class="btn solid" type="button" id="dSubmit">Submit</button></div>
 </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* localCTF flag portal. No accounts, no server, no network. */

var SKEY="ctf_solved", THEME_KEY="ctf_theme";

var CH=[
 {id:"ch01",n:"01",code:"TXT",title:"Welcome",cat:"Sanity",pts:10,
  desc:"The first flag is not hidden at all. Read the welcome file and take it.",
  hint:"cat welcome.txt",hash:"580562c636836a86",
  files:[["welcome.txt","challenges/ch01_welcome/welcome.txt"]]},
 {id:"ch02",n:"02",code:"DOT",title:"Hidden in plain sight",cat:"Forensics",pts:10,
  desc:"Normal listings do not show every file. Find the hidden one in this directory.",
  hint:"unzip ch02_hidden.zip && ls -la ch02_hidden",hash:"a232e0dc44369dfa",
  files:[["ch02_hidden.zip","challenges/ch02_hidden.zip"]]},
 {id:"ch03",n:"03",code:"B64",title:"Base64",cat:"Encoding",pts:10,
  desc:"Base64 is an encoding, not encryption. Decode the file to read the flag.",
  hint:"base64 -d encoded.txt",hash:"ceff8deb806e9b2b",
  files:[["encoded.txt","challenges/ch03_base64/encoded.txt"]]},
 {id:"ch04",n:"04",code:"HEX",title:"Hexadecimal",cat:"Encoding",pts:10,
  desc:"The flag is stored as hexadecimal bytes. Convert it back to text.",
  hint:"xxd -r -p hex.txt",hash:"7396c3c4c76dca0c",
  files:[["hex.txt","challenges/ch04_hex/hex.txt"]]},
 {id:"ch05",n:"05",code:"ROT",title:"ROT13",cat:"Cryptography",pts:10,
  desc:"Every letter was shifted 13 places. Apply the same shift to decode it.",
  hint:"tr 'A-Za-z' 'N-ZA-Mn-za-m' < rot13.txt",hash:"1046a8e66639f5c4",
  files:[["rot13.txt","challenges/ch05_rot13/rot13.txt"]]},
 {id:"ch06",n:"06",code:"IMG",title:"Never trust the extension",cat:"Forensics",pts:10,
  desc:"A .jpg name proves nothing. Ask the system what the file really is, then read it.",
  hint:"file photo.jpg",hash:"305a63c0e8093fb6",
  files:[["photo.jpg","challenges/ch06_filetype/photo.jpg"]]},
 {id:"ch07",n:"07",code:"BIN",title:"Strings",cat:"Forensics",pts:10,
  desc:"The flag is embedded in a binary file among unreadable bytes. Pull out the text.",
  hint:"strings data.bin | grep EVIL",hash:"dcf37029616abfe3",
  files:[["data.bin","challenges/ch07_strings/data.bin"]]},
 {id:"ch08",n:"08",code:"LOG",title:"Logs tell stories",cat:"Forensics",pts:10,
  desc:"Search the web server log for something suspicious. The flag left a trace.",
  hint:"grep EVIL access.log",hash:"d4601cc99cb0d023",
  files:[["access.log","challenges/ch08_logs/access.log"]]},
 {id:"ch09",n:"09",code:"REV",title:"Backwards",cat:"Encoding",pts:10,
  desc:"The text was written in reverse. Flip it around to read the flag.",
  hint:"rev backwards.txt",hash:"65e11675fcd2cf7d",
  files:[["backwards.txt","challenges/ch09_reverse/backwards.txt"]]},
 {id:"ch10",n:"10",code:"TREE",title:"The tree",cat:"Linux",pts:10,
  desc:"The flag is buried in a folder tree full of decoys. Search instead of clicking.",
  hint:"unzip ch10_find.zip && grep -r \"EVIL-ENUMA\" ch10_find",hash:"c07d12e007eef8b4",
  files:[["ch10_find.zip","challenges/ch10_find.zip"]]}
];
var TOTAL=CH.reduce(function(a,c){return a+c.pts;},0);

var solved={};
try{ var raw=JSON.parse(localStorage.getItem(SKEY)||"{}"); if(raw&&typeof raw==="object"&&!Array.isArray(raw)) solved=raw; }catch(e){}

var $=function(id){return document.getElementById(id);};
var list=$("list"), empty=$("empty"), q=$("q"), filter=$("filter"), toastEl=$("toast"), dlg=$("dlg");
var currentId=null, toastTimer=null;

/* Non-cryptographic fingerprints (FNV-1a + djb2). The plaintext flags
   are not stored in this file, so viewing source does not reveal them. */
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function djb(s){var h=5381;for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return h>>>0;}
function hashFlag(s){s=s.trim();return fnv(s).toString(16).padStart(8,"0")+djb(s).toString(16).padStart(8,"0");}

function save(){try{localStorage.setItem(SKEY,JSON.stringify(solved));}catch(e){toast("Could not save progress.");}}
function solvedCount(){return CH.filter(function(c){return !!solved[c.id];}).length;}
function points(){return CH.reduce(function(a,c){return a+(solved[c.id]?c.pts:0);},0);}

function updateStats(){
 var n=solvedCount(), p=points();
 $("sSolved").textContent=n+"/"+CH.length;
 $("sPoints").textContent=p+" / "+TOTAL;
 $("sStatus").textContent=(n===CH.length)?"COMPLETE":"IN PROGRESS";
 $("pbar").style.width=(n/CH.length*100)+"%";
 var pb=document.querySelector(".progress");
 if(pb) pb.setAttribute("aria-valuenow",String(n));
}

function renderList(){
 var query=q.value.trim().toLowerCase(), f=filter.value;
 list.innerHTML="";
 list.classList.add("anim");
 var shown=0;
 CH.forEach(function(c,idx){
  var isSolved=!!solved[c.id];
  if(f==="solved"&&!isSolved) return;
  if(f==="unsolved"&&isSolved) return;
  if(query){
   var hay=(c.title+" "+c.cat+" "+c.code+" "+c.desc).toLowerCase();
   if(hay.indexOf(query)===-1) return;
  }
  var row=document.createElement("article");
  row.className="row"+(isSolved?" solved":"");
  row.style.setProperty("--i",String(shown));
  row.innerHTML=
   '<div class="rank">'+c.n+'</div>'+
   '<div class="info">'+
    '<div class="t">'+c.title+(isSolved?' <span class="tag done">SOLVED</span>':'')+'</div>'+
    '<p class="n">'+c.desc+'</p>'+
    '<span class="tag">'+c.cat+' · '+c.pts+' PTS</span>'+
   '</div>'+
   '<div class="acts"><button class="btn'+(isSolved?'':' solid')+'" type="button" data-open>'+ (isSolved?"Review":"Open") +'</button></div>';
  row.addEventListener("click",function(e){
   if(e.target.closest("[data-open]")) e.stopPropagation();
   openChallenge(c);
  });
  row.querySelector("[data-open]").addEventListener("click",function(e){
   e.stopPropagation(); openChallenge(c);
  });
  list.appendChild(row);
  shown++;
 });
 empty.hidden=shown>0;
}

function openChallenge(c){
 currentId=c.id;
 $("dlgTitle").textContent=c.n+" · "+c.title;
 $("dMeta").innerHTML='<span>'+c.cat+'</span><span>'+c.pts+' PTS</span><span>'+c.code+'</span>';
 $("dDesc").textContent=c.desc;
 $("dHint").textContent=c.hint;
 var files=$("dFiles");
 files.innerHTML="";
 c.files.forEach(function(f){
  var a=document.createElement("a");
  a.className="link";
  a.href=f[1];
  a.setAttribute("download","");
  a.target="_blank";
  a.rel="noopener";
  a.innerHTML='<span>'+f[0]+'</span><svg class="i"><use href="#i-ext"/></svg>';
  files.appendChild(a);
 });
 $("dFlag").value="";
 $("dFlag").classList.remove("shake");
 $("dStamp").hidden=true;
 $("dStamp").classList.remove("run");
 var isSolved=!!solved[c.id];
 $("dSolved").hidden=!isSolved;
 if(isSolved) $("dSolvedFlag").textContent=solved[c.id];
 if(!dlg.open) dlg.showModal();
 setTimeout(function(){$("dFlag").focus();},60);
}

function showToast(msg){
 toastEl.textContent=msg;
 toastEl.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){toastEl.classList.remove("show");},2400);
}

function submitFlag(){
 var c=CH.filter(function(x){return x.id===currentId;})[0];
 if(!c) return;
 var val=$("dFlag").value.trim();
 if(!val){showToast("Type a flag first.");return;}
 if(hashFlag(val)===c.hash){
  solved[c.id]=val; save();
  $("dSolved").hidden=false;
  $("dSolvedFlag").textContent=val;
  $("dStamp").hidden=false;
  $("dStamp").classList.remove("run");
  void $("dStamp").offsetWidth;
  $("dStamp").classList.add("run");
  $("dFlag").value="";
  updateStats(); renderList();
  showToast("Correct flag. Challenge solved.");
 }else{
  $("dFlag").classList.remove("shake");
  void $("dFlag").offsetWidth;
  $("dFlag").classList.add("shake");
  showToast("Wrong flag. Check your answer and try again.");
 }
}

function setTheme(t){
 document.documentElement.setAttribute("data-theme",t);
 try{localStorage.setItem(THEME_KEY,t);}catch(e){}
 var m=document.querySelector('meta[name="theme-color"]');
 if(m) m.setAttribute("content",t==="light"?"#ffffff":"#000000");
}

/* ---------- Wire up ---------- */
$("themeBtn").addEventListener("click",function(){
 setTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light");
});
q.addEventListener("input",renderList);
filter.addEventListener("change",renderList);
$("resetBtn").addEventListener("click",function(){
 if(!confirm("Clear all solved challenges stored in this browser?")) return;
 solved={}; save(); updateStats(); renderList(); showToast("Progress cleared.");
});
$("dSubmit").addEventListener("click",submitFlag);
$("dFlag").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submitFlag();}});
Array.prototype.forEach.call(document.querySelectorAll("[data-close]"),function(b){
 b.addEventListener("click",function(){dlg.close();});
});
dlg.addEventListener("click",function(e){if(e.target===dlg) dlg.close();});
$("fab").addEventListener("click",function(){
 var next=CH.filter(function(c){return !solved[c.id];})[0];
 if(next) openChallenge(next); else showToast("Everything is solved.");
});

updateStats();
renderList();
</script>
</body>
</html>
